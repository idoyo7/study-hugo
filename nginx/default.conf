# study-hugo 정적 서빙 설정.
#
# 그동안 nginx:alpine 기본 설정을 그대로 썼다. 라이브에서 확인된 결과 넷.
#
#   1) 압축이 전혀 걸리지 않았다. Accept-Encoding: gzip, br 을 보내도
#      content-encoding 헤더가 없고 홈이 407,087 바이트로 내려왔다.
#      gzip -9 로 재면 29,534 바이트 — 92.8% 를 그냥 버리고 있었다.
#   2) Cache-Control 헤더가 아예 없었다. 파일명에 콘텐츠 해시가 박힌
#      불변 자산까지 매 방문 조건부 재검증을 돌았다.
#   3) 404 가 nginx 기본 페이지(153바이트, 링크 0개)로 나갔다. Hugo 가 만든
#      /404.html 이 error_page 로 연결돼 있지 않았다.
#   4) 슬래시 없는 URL 의 301 이 스킴을 강등했다:
#        https://docs.makgol.com/istio  →  301  →  http://docs.makgol.com/istio/
#      nginx 가 절대 Location 을 만들면서 자기가 듣는 리스너(평문 80)를 기준으로
#      스킴을 적기 때문이다. Istio ingress gateway 뒤라 nginx 는 원래 요청이
#      https 였다는 사실을 모른다. 평문 홉이 하나 끼고 리다이렉트가 2홉이 된다.
#   5) Content-Type 에 charset 이 없었다(content-type: text/html). 한글
#      콘텐츠라 charset 은 명시하는 편이 안전하다.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset       utf-8;
    charset_types text/css text/plain text/xml text/markdown application/javascript application/json application/manifest+json;

    # (4) 절대 Location 을 만들지 않는다. 상대 Location 이면 스킴을 적을 일이
    # 없으므로 프록시 뒤에서 강등이 발생하지 않는다. port_in_redirect 도 함께
    # 끈다 — 컨테이너 내부 포트가 Location 에 새는 것을 막는다.
    absolute_redirect off;
    port_in_redirect  off;

    server_tokens off;

    # ── (1) 압축 ──────────────────────────────────────────────────────────
    # 빌드 시점에 gzip -9 로 미리 압축해 두고(Dockerfile) gzip_static 으로
    # 그 파일을 그대로 낸다. 요청마다 CPU 를 쓰지 않으면서 런타임 압축보다
    # 높은 압축률(-9 vs -6)을 쓸 수 있다. .gz 가 없는 응답은 아래 런타임
    # gzip 이 받는다.
    #
    # brotli 는 넣지 않았다. nginx:alpine 공식 이미지에 ngx_brotli 가 없어
    # 모듈을 직접 빌드해야 하는데, gzip 으로 이미 92.8% 를 회수하므로
    # 추가 5~15% 를 위해 빌드 파이프라인을 늘릴 이유가 약하다.
    gzip_static on;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/markdown
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        image/svg+xml;

    # ── (2) 캐시 ──────────────────────────────────────────────────────────
    # 파일명에 콘텐츠 해시가 박힌 것들: 내용이 바뀌면 이름이 바뀌므로 영구 캐시.
    # Hugo fingerprint 는 SHA-256 hex 64자를 확장자 앞에 붙인다
    #   js/main.min.<64hex>.js  /  ko.search.min.<64hex>.js  /  css/compiled/main.<64hex>.css
    location ~* "\.[0-9a-f]{32,}\.(?:css|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 이름에 해시가 없는 정적 자산 — 하루 캐시 후 재검증.
    location ~* \.(?:css|js|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        access_log off;
    }

    # 검색 인덱스는 파일명에 해시가 없다(3.3MB). 짧게 잡고 재검증에 맡긴다.
    location = /ko.search-data.json {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # 페이지별 마크다운 출력([outputs] 의 markdown 포맷). nginx 기본 mime.types 에
    # .md 가 없어 그대로 두면 application/octet-stream 으로 나가고, 브라우저는
    # 파일을 내려받고 크롤러는 본문으로 읽지 않는다.
    #
    # server 레벨 `types { text/markdown md; }` 로는 고치면 안 된다 — types 는
    # http 에서 상속된 mime.types 를 확장하지 않고 통째로 대체하기 때문에,
    # 그렇게 했을 때 나머지 전부가 octet-stream 이 됐다(홈 포함, 실측).
    # location + default_type 은 mime 맵을 건드리지 않는다.
    #
    # 정규식 location 은 먼저 매치한 하나만 적용되므로 아래 html|xml|txt 블록보다
    # 앞에 와야 한다. Cache-Control 도 여기서 같이 준다.
    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # .webmanifest 도 기본 mime.types 에 없다(octet-stream 으로 나갔다).
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # HTML·사이트맵·robots·llms 는 항상 재검증한다. 배포가 잦고, 캐시 스큐가
    # 곧 낡은 canonical·낡은 사이트맵으로 이어진다.
    location ~* \.(?:html|xml|txt)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── (3) 404 ───────────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
