# 절대 baseURL 은 선택이 아니다. '/' 였던 동안 canonical·og:url·sitemap 176건·RSS 가
# 전부 상대 경로로 나갔고, sitemaps.org 는 <loc> 에 절대 URL을 요구하기 때문에
# 사이트맵 파일이 통째로 무효 처리됐다. 정식 호스트는 docs.makgol.com 이다
# (hugo.makgol.com·study-hugo.makgol.com 은 같은 콘텐츠를 서빙하는 구 호스트).
baseURL = 'https://docs.makgol.com/'
title = 'Ops Insights'
theme = 'hextra'
# .Site.Copyright — RSS <copyright> 로 나간다. 푸터 문구는 i18n/ko.yaml 의 copyright 키.
# 최상위 bare key 라 첫 테이블 헤더([markup]) 앞에 있어야 한다 — 아래로 내려가면
# 그 테이블 하위 키로 파싱돼 경고 없이 죽는다. 그래서 title·theme 옆에 붙여 둔다.
# 연도는 i18n/ko.yaml 의 copyright 와 한 쌍이다. 해가 바뀌면 두 곳을 같이 고쳐라 —
# 한쪽만 고치면 RSS 와 푸터의 연도가 갈리고 빌드는 경고 없이 성공한다.
copyright = '© 2026 Mont'

# Korean content
locale = 'ko-KR'
defaultContentLanguage = 'ko'
hasCJKLanguage = true

disableKinds = ['taxonomy', 'term']

# layouts/robots.txt 를 렌더한다. 켜지 않으면 Hugo 는 robots.txt 를 만들지 않고,
# 라이브에서 두 호스트 모두 404 였다 — 사이트맵 선언 경로가 아예 없었다.
enableRobotsTXT = true

# 테마(hextra)가 themes/hextra/hugo.toml 에서 outputFormats.llms 와
# outputFormats.markdown 을 정의하지만 활성화는 하지 않는다. 여기서 켠다.
#   /llms.txt              — 176개 문서의 섹션 트리 + 요약 (AI 크롤러 진입점)
#   /<경로>/<파일>.md       — 페이지별 원문 마크다운
# JS 를 돌리지 않는 크롤러가 사이드바 마크업 83% 를 헤집지 않고 본문만 읽을 수 있다.
[outputs]
  home = ['html', 'rss', 'llms']
  page = ['html', 'markdown']
  section = ['html', 'rss', 'markdown']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    # Hextra ships its own Chroma CSS (light/dark aware); classes required
    noClasses = false

[params]
  # 테마 components/last-updated.html 이 이 스위치를 보고 문서 끝에
  # "Last updated on <날짜>" 를 렌더한다. enableGitInfo 로 .Lastmod 가
  # 채워졌으니 이제 표시할 값이 있다. 신선도는 검색·AI 인용 양쪽에서
  # 값을 갖는 신호인데, 이 사이트는 176편이 전부 최근 문서인데도
  # 그 사실을 밖으로 내보내지 않고 있었다.
  displayUpdatedDate = true
  # og:site_name 이 참조하는 값 (테마 opengraph.html 은 .Site.Params.title 을 본다.
  # 최상위 title 이 아니라 params.title 이라 별도로 둔다).
  title = 'Ops Insights'

  # 홈과 28개 목록 페이지의 meta description·og:description 원천. 없던 동안
  # 홈은 값이 빈 <meta name="description"> 를, 목록 페이지는 공백만 든
  # og:description 을 내보냈다.
  description = 'Kubernetes·관측성·데이터스토어를 직접 운영하며 남은 판단 근거를 도메인별로 정리한 지식베이스. Istio, Karpenter, VictoriaMetrics, ClickHouse, ElastiCache.'
  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.theme]
    # light | dark | system
    default = 'system'
    displayToggle = true

  [params.search]
    enable = true
    type = 'flexsearch'
    [params.search.flexsearch]
      # index page by: content | summary | heading | title
      index = 'content'
      # 'full' 을 쓴 이유로 적혀 있던 주석("CJK 부분 문자열 검색을 켠다")은 사실이
      # 아니었다. hextra 가 넘기는 커스텀 인코더(themes/hextra/assets/js/flexsearch.js:201)
      # 는 CJK 를 한 글자짜리 대안으로 잡고(`+` 없음) 라틴·키릴만 연속으로 잡는다.
      #   encode('노드풀 스케줄링')     -> ["노","드","풀","스","케","줄","링"]
      #   encode('kubernetes karpenter') -> ["kubernetes","karpenter"]
      # 한글은 tokenize 가 돌기 전에 이미 음절 단위로 쪼개져 있어서 이 설정이
      # 한글 검색에 영향을 줄 수가 없다.
      #
      # 실제 인덱스(ko.search-data.json 3,289,190 B · 176 라우트 · 문서 7,785개)로
      # preloadIndex() 를 그대로 재현해 재봤다. node v24.15.0, Apple silicon:
      #   full     build 1,307 ms   heap 243.5 MB
      #   forward  build   473 ms   heap  60.1 MB
      #   strict   build   270 ms   heap  21.4 MB
      # JSON.parse 는 6.5 ms 다 — 비용은 파싱이 아니라 인덱스 구축이다.
      # 히트 수(limit 20)는 '스케줄링' '케줄' '노드풀' '드풀' '벤치마크' '치마'
      # '컨설리데이션' '리데이' 전부 세 모드에서 20으로 같았다. 라틴도 접두
      # 질의('karp' 'nodepo' 'istio')는 forward 에서 그대로 20이다.
      # full 만 되는 건 라틴 단어 중간을 치는 경우('arpent' -> karpenter,
      # 'toriametr' -> victoriametrics)뿐이고, 그 대가로 구축 시간과 힙이 3~4배다.
      # 게다가 flexsearch.js:235 의 적재 루프는 중간에 양보하지 않아서 느린 기기에서
      # 검색창을 여는 순간 다음 입력의 INP 를 그대로 먹는다.
      # 그래서 테마 기본값과 같은 forward 로 내린다. 명시해 두는 건 의도 기록용이다.
      tokenize = 'forward'

  # GitHub Discussions 덧글 (giscus) — idoyo7/blog-comments 공유, 이 사이트는 Ideas 카테고리
  # (Nextra=Announcements, Jekyll=General 과 분리). theme 생략 → hextra가 다크모드 자동 동기화
  [params.comments]
    enable = true
    type = 'giscus'
    [params.comments.giscus]
      repo = 'idoyo7/blog-comments'
      repoId = 'R_kgDOTiU4bg'
      category = 'Ideas'
      categoryId = 'DIC_kwDOTiU4bs4DB3-d'
      mapping = 'pathname'
      reactionsEnabled = '1'
      inputPosition = 'top'
      lang = 'ko'

  # 아래 두 테이블은 일부러 파일 끝에 둔다. TOML 은 테이블 헤더 뒤의 bare key 를 그
  # 테이블 소속으로 파싱하므로, 이 테이블들을 [params] 직후에 두면 나중에 [params]
  # 직속 키(description·displayUpdatedDate 같은 것)를 추가하는 사람이 그 키를 아래에
  # 붙였을 때 조용히 [params.footer] 하위로 들어간다. Hugo 는 경고 없이 성공하고 해당
  # 기능만 죽는다. [params] 직속 bare key 는 [params] 줄과 [params.navbar] 사이에 넣어라.

  # 저자 이름. 테마 list.rss.xml:7-9,30 은 managingEditor·webMaster·<author> 를 전부
  # `with .Site.Params.Author.email` 로 감싸므로 email 이 없는 지금 이 name 은 산출물에
  # 나오지 않는다(실측 0장). email 을 넣기로 할 때를 위한 자리로만 남긴다 — 넣으면
  # 주소가 RSS 28개 피드에 그대로 공개된다.
  # 형제 브랜치 seo/structured-data 는 이 키를 읽지 않고 자기 기본값
  # (`site.Params.schema.authorName | default "Mont"`)으로 JSON-LD Person 을 낸다.
  # 이름이 두 군데 따로 박혀 있으니 머지할 때 authorName 을 이 키로 돌려 두는 편이 낫다.
  [params.author]
    name = 'Mont'
    # email = ''

  # displayPoweredBy 는 적지 않는다. footer.html:4,28 이 `| default true` 로 읽어
  # 이미 켜져 있고, 명시해도 렌더 결과가 같다.
  [params.footer]
    displayCopyright = true
# 홈 <title> 전용. 테마 head.html 은 홈에서 title='Ops Insights' 12자만 내보낸다.
# 프런트매터 title 을 늘리면 h1·og:title 까지 같이 늘어나므로 title 태그만 따로 둔다.
# layouts/partials/head.html 오버라이드가 이 값을 읽는다.
#
# [params] 직하의 벌거벗은 키로 두지 않는 이유: 형제 브랜치 여러 개가 [params] 바로
# 다음 줄에 삽입한다([params.author] 서브테이블 포함). 머지 해소에서 이 키가 그 아래로
# 밀리면 조용히 params.author.homeTitle 이 되고, 빌드는 통과한 채 홈 title 만 12자로
# 되돌아간다. 전용 서브테이블은 다른 테이블에 삼켜지지 않는다.
[params.seo]
  homeTitle = 'Ops Insights — 쿠버네티스·관측성 운영 지식베이스'
# 날짜 해석 순서 — 프런트매터 lastmod 를 :git 보다 우선한다.
# 메타데이터 일괄 커밋이 GitInfo 의 .Lastmod 를 오염시키므로(전 파일이 같은 날짜가 됨),
# 실제 본문 수정일을 lastmod 로 핀해 둔다. 본문을 고칠 때 lastmod 를 갱신하거나 지우면
# 그 다음부터는 :git(해당 수정 커밋)이 이어받는다.
[frontmatter]
  lastmod = ['lastmod', ':git', 'date']
# navbar 검색창. hextra 는 navbar.html:23 에서 menu.main 항목의
# params.type == "search" 를 만났을 때만 search.html 을 싣는다
# (themes/hextra/layouts/_partials/navbar.html). 이 항목이 없으면
# [params.search] 를 켜 두고 flexsearch 인덱스(3.3MB)를 굽더라도
# 768px 이상 뷰포트에는 검색창이 아예 나오지 않는다 — 실제로 그랬다.
[[menu.main]]
  name = 'Search'
  weight = 90
  [menu.main.params]
    type = 'search'
